<div id="splash">

  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>الخطة</span></button>

<div id="sheet" hidden><div class="sheet-bg"></div><div class="sheet-card" id="sheetBody"></div></div>
