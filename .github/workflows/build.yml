name: بناء APK (أندرويد)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Tahadi30.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tahadi30-apk
          path: Tahadi30.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: تحدي ٣٠ يوم — v1.0.${{ github.run_number }}
          body: |
            حمّل ملف **Tahadi30.apk** من الأسفل وثبّته على جوالك.
            التحديثات تُثبّت فوق النسخة السابقة دون أن تُفقد بياناتك.
          files: Tahadi30.apk
          make_latest: true
