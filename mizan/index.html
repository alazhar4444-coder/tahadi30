<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ميزان</title>
<meta name="theme-color" content="#F5F7F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ميزان">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="stylesheet" href="app.css?v=1">
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icon-512.png" alt="" class="sp-ic"><div class="sp-t">ميزان</div><div class="sp-s">خسارة وزن صحية ومستدامة</div></div>
<main id="view"></main>
<button id="fab" class="fab" data-act="fab" aria-label="سجّل وجبة"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>سجّل وجبة</span></button>
<nav class="tabs" id="tabs">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>اليوم</span></button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 7l6 6 4-4 8 8M21 11v6h-6"/></svg><span>التقدّم</span></button>
  <button data-tab="workout"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>التمارين</span></button>
  <button data-tab="guide"><svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5v13"/></svg><span>الدليل</span></button>
</nav>
<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-card" id="sheetBody"></div></div>
<div id="toast" class="toast"></div>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s)s.parentNode.removeChild(s);},2600);</script>
<script src="content.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
