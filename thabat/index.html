<!doctype html>

<body>
<div id="splash" aria-hidden="true">
  <img src="icon-512.png" alt="" class="sp-ic">
  <div class="sp-t">ثبات</div>

</div>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z"/></svg><span>الرئيسية</span></button>
  <button data-tab="insights"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>أنماطي</span></button>
  <button class="sos-tab" data-act="sos" aria-label="أشعر برغبة الآن"><span class="sos-dot"><svg viewBox="0 0 24 24"><path d="M2 12c2.5-3 5-3 7.5 0s5 3 7.5 0 3.5-3 5 0M2 17c2.5-3 5-3 7.5 0s5 3 7.5 0 3.5-3 5 0M2 7c2.5-3 5-3 7.5 0s5 3 7.5 0 3.5-3 5 0"/></svg></span><span>رغبة الآن</span></button>

<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-card" id="sheetBody"></div></div>
<div id="lock" class="lock" hidden></div>
<div id="toast" class="toast"></div>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s)s.parentNode.removeChild(s);},2600);</script>

<script src="app.js?v=1"></script>
