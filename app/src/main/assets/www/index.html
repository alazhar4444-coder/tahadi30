<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>تحدي ٣٠ يوم</title>
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تحدي ٣٠">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg class="sp-logo" viewBox="0 0 200 200">
    <defs>
      <linearGradient id="spbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2F86"/><stop offset=".55" stop-color="#16184A"/><stop offset="1" stop-color="#090A24"/></linearGradient>
      <linearGradient id="spr1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FA114F"/><stop offset="1" stop-color="#FF6A95"/></linearGradient>
      <linearGradient id="spr2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3DD34A"/><stop offset="1" stop-color="#C2F75F"/></linearGradient>
      <linearGradient id="spr3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C7E6"/><stop offset="1" stop-color="#7DF0FA"/></linearGradient>
      <linearGradient id="spm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF4C7"/><stop offset="1" stop-color="#FFC94A"/></linearGradient>
    </defs>
    <rect class="sp-bg" width="200" height="200" rx="46" fill="url(#spbg)"/>
    <g transform="rotate(-90 100 100)" fill="none" stroke-linecap="round" stroke-width="13">
      <circle cx="100" cy="100" r="66" stroke="#FA114F" stroke-opacity=".2"/><circle class="sp-r r1" cx="100" cy="100" r="66" stroke="url(#spr1)" pathLength="100"/>
      <circle cx="100" cy="100" r="50" stroke="#3DD34A" stroke-opacity=".2"/><circle class="sp-r r2" cx="100" cy="100" r="50" stroke="url(#spr2)" pathLength="100"/>
      <circle cx="100" cy="100" r="34" stroke="#00C7E6" stroke-opacity=".2"/><circle class="sp-r r3" cx="100" cy="100" r="34" stroke="url(#spr3)" pathLength="100"/>
    </g>
    <path class="sp-moon" fill="url(#spm)" d="M107 84 A18 18 0 1 0 107 116 A22 22 0 0 1 107 84 Z"/>
  </svg>
  <div class="sp-t">تحدي ٣٠ يوم</div>
  <div class="sp-s">صلاة · قرآن · صحة</div>
</div>
<div id="app">
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <span class="tab-ind" id="tabInd"></span>
    <button data-tab="today" class="on">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="3.5"/><path d="M3.5 9.5h17M8 2.8v3.4M16 2.8v3.4M8.5 14.5l2.5 2.5 4.5-4.5"/></svg><span>اليوم</span></button>
    <button data-tab="challenge">
      <svg viewBox="0 0 24 24"><path d="M7.5 4h9v5.5a4.5 4.5 0 0 1-9 0zM7.5 6H4.5v1.5a3 3 0 0 0 3 3M16.5 6h3v1.5a3 3 0 0 1-3 3M12 14v3.5M8.5 20.5h7M9.5 17.5h5"/></svg><span>إنجازاتي</span></button>
    <button data-tab="prayer">
      <svg viewBox="0 0 24 24"><path d="M12 3c2.2 2 4.5 3.2 4.5 6.2V11h-9V9.2C7.5 6.2 9.8 5 12 3zM5.5 21V13.5h13V21M3.5 21h17M10 21v-3.5a2 2 0 0 1 4 0V21"/></svg><span>الصلاة</span></button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4.9a7.5 7.5 0 0 0-2.6-1.5L14 2.4h-4l-.4 2.5A7.5 7.5 0 0 0 7 6.4l-2.4-.9-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4.9 2-3.4z"/></svg><span>الإعدادات</span></button>
  </nav>
  <div id="sheet" class="sheet" hidden><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-card" id="sheetBody"></div></div>
  <div id="toast" class="toast"></div>
</div>
<script src="content.js"></script>
<script src="praytime.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
